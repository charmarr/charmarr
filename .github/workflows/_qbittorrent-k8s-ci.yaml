name: "qBittorrent K8s: CI"

on:
  workflow_call:

jobs:
  quality:
    uses: charmarr/.github/.github/workflows/charm-ci.yaml@v2
    with:
      charm-path: charms/qbittorrent-k8s
      use-parrot: true
    secrets: inherit

  integration:
    needs: quality
    uses: charmarr/.github/.github/workflows/charm-integration.yaml@v2
    with:
      charm-path: charms/qbittorrent-k8s
      use-parrot: false
      substrate: k8s
      substrate-channel: "1.32-classic/stable"
      # Mesh coverage lives in the nightly workflows, not the PR path.
      exclude-suites: '["test_mesh.py"]'
    secrets: inherit
