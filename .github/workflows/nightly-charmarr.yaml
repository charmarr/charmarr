name: nightly

on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *'

jobs:
  service-mesh-qbittorrent:
    name: Service mesh / qbittorrent
    uses: charmarr/.github/.github/workflows/charm-integration.yaml@v2
    with:
      charm-path: charms/qbittorrent-k8s
      substrate: k8s
      substrate-channel: "1.32-classic/stable"
      configure-cni-for-istio: true
      include-suites: '["test_mesh.py"]'
      soft-fail: true
    secrets: inherit

  service-mesh-sabnzbd:
    name: Service mesh / sabnzbd
    uses: charmarr/.github/.github/workflows/charm-integration.yaml@v2
    with:
      charm-path: charms/sabnzbd-k8s
      substrate: k8s
      substrate-channel: "1.32-classic/stable"
      configure-cni-for-istio: true
      include-suites: '["test_mesh.py"]'
      soft-fail: true
    secrets: inherit

  service-mesh-flaresolverr:
    name: Service mesh / flaresolverr
    uses: charmarr/.github/.github/workflows/charm-integration.yaml@v2
    with:
      charm-path: charms/flaresolverr-k8s
      substrate: k8s
      substrate-channel: "1.32-classic/stable"
      configure-cni-for-istio: true
      include-suites: '["test_mesh.py"]'
      soft-fail: true
    secrets: inherit

  service-mesh-gluetun:
    name: Service mesh / gluetun VPN egress
    uses: charmarr/.github/.github/workflows/charm-integration.yaml@v2
    with:
      charm-path: charms/gluetun-k8s
      substrate: k8s
      substrate-channel: "1.32-classic/stable"
      configure-cni-for-istio: true
      include-suites: '["test_istio_mesh.py"]'
      soft-fail: true
    secrets: inherit

  integration:
    name: charmarr deployment
    runs-on: ubuntu-latest
    # The Istio scenario now deploys the control plane itself and swaps every
    # ingress app over from traefik, on top of the two preceding scenarios.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Setup environment
        uses: charmarr/.github/actions/charm/setup@v2
        with:
          juju: "true"
          charmcraft: "false"
          substrate: k8s
          substrate-channel: "1.32-classic/stable"
          configure-cni-for-istio: "true"

      - name: Install Terraform
        run: |
          sudo snap install terraform --classic

      - name: Install test dependencies
        run: |
          uv venv
          uv pip install pytest pytest-bdd jubilant "pytest-jubilant<2" charmarr-lib-testing tenacity

      - name: Run integration tests
        env:
          WIREGUARD_PRIVATE_KEY: ${{ secrets.WIREGUARD_PRIVATE_KEY }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          source .venv/bin/activate
          pytest tests/integration/charmarr/ -v --tb=short --log-cli-level=WARNING
