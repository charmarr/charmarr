name: nightly

on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *'

permissions:
  contents: read

jobs:
  integration:
    name: charmarr deployment
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Setup environment
        uses: charmarr/.github/actions/charm/setup@v2
        with:
          juju: "true"
          charmcraft: "false"
          substrate: k8s
          substrate-channel: "1.32-classic/stable"

      - name: Install Terraform
        run: |
          sudo snap install terraform --classic

      - name: Install test dependencies
        run: |
          uv venv
          uv pip install pytest pytest-bdd jubilant "pytest-jubilant<2" charmarr-lib-testing tenacity

      - name: Run integration tests
        env:
          WIREGUARD_PRIVATE_KEY: ${{ secrets.WIREGUARD_PRIVATE_KEY }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          source .venv/bin/activate
          pytest tests/integration/charmarr/ -v --tb=short --log-cli-level=WARNING
